data:
  text: The Agent SDK and its platform binary are gone (slice 2). Packaging now needs to locate `kiro-cli` (and `claude-agent-acp` when configured) rather than ship them; draft resolves them from PATH or the `agents` entries in config.json. A packaged app started from the Dock gets a minimal PATH, so this needs a lookup in the usual install locations (`~/.local/bin`, `/opt/homebrew/bin`).
