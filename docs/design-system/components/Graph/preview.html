<!-- @dsCard group="Map" height=420 subtitle="Clusters, stepped-out items, edges and a cascade" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The map's graph</title>
<style>
body{margin:0;font-family:var(--font-sans);background:var(--page);color:var(--text);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);font-size:12.5px;line-height:1;font-weight:500;padding:7px var(--space-3);border-radius:var(--radius-chip);border:1px solid transparent;white-space:nowrap}
.chip i{font-style:normal;font-size:11px}
.moved{background:var(--moved-fill);color:var(--moved-strong)}
.done{background:var(--done-fill);color:var(--done-word)}
.review{background:var(--review-fill);color:var(--review-word)}
.waiting{background:var(--waiting-fill);color:var(--waiting-word)}
.failed{background:var(--waiting-fill);color:var(--waiting-word);border:var(--hairline-dashed) dashed var(--waiting-mark)}
.idle{background:transparent;color:var(--muted);border:var(--hairline) solid var(--idle-line)}
.loop{background:transparent;color:var(--muted);border:var(--hairline-dashed) dashed var(--loop-mark)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.k{width:150px;flex:none;color:var(--muted);font-size:12px}
.edge{stroke:var(--edge);stroke-linecap:round}.tether{stroke:var(--edge);stroke-width:1;stroke-dasharray:1 3}.disc{fill:var(--surface);stroke:var(--line-strong);stroke-width:.6}.disc.wait{fill:var(--waiting-fill);stroke:var(--waiting-mark)}.settled{fill:none;stroke:var(--done-mark);stroke-width:2.5;stroke-linecap:round}.count{font:600 13px var(--font-sans);fill:var(--ink)}.count.wait{fill:var(--waiting-word)}.lab{font:12px var(--font-sans);fill:var(--muted)}.item{stroke-width:.75}.item.moved{fill:var(--moved-fill);stroke:var(--moved-mark)}.item.waiting{fill:var(--waiting-fill);stroke:var(--waiting-mark)}.item.done{fill:var(--done-fill);stroke:var(--done-mark)}.item.loop{fill:none;stroke:var(--loop-mark);stroke-dasharray:3 2}.cascade{fill:none;stroke:var(--moved-mark);stroke-width:1.6}.waits{fill:none;stroke:var(--waiting-mark);stroke-width:1.6}.frame{background:var(--raised);border:var(--hairline) solid var(--line-strong);border-radius:var(--radius-card);padding:12px;display:inline-block}.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}</style></head>
<body>
<div style="padding:16px" data-draws="m02-graph m06-kiro-remote-context m07-supersedes-edge"><div class="frame"><svg viewBox="0 0 620 296" width="620" height="296" role="img" aria-label="The map as a graph"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--moved-mark)"/></marker><marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--waiting-mark)"/></marker></defs><line class="edge" x1="148.0" y1="106.4" x2="256.0" y2="101.9" stroke-width="4"/><line class="edge" x1="343.8" y1="104.2" x2="454.1" y2="114.9" stroke-width="5"/><line class="edge" x1="271.7" y1="133.7" x2="204.0" y2="214.5" stroke-width="2"/><line class="tether" x1="169.1" y1="64.5" x2="139.8" y2="86.1"/><line class="tether" x1="253.6" y1="51.9" x2="270.2" y2="69.0"/><line class="tether" x1="54.9" y1="68.4" x2="80.0" y2="86.4"/><line class="tether" x1="546.8" y1="78.0" x2="511.9" y2="101.0"/><line class="tether" x1="543.2" y1="161.4" x2="510.7" y2="136.7"/><line class="tether" x1="368.0" y1="164.4" x2="331.2" y2="129.6"/><path class="cascade" d="M188 52 Q212 34 234 40" marker-end="url(#a)"/><path class="waits" d="M330 130 Q420 190 468 142" marker-end="url(#w)"/><circle class="disc " cx="110" cy="108" r="34"/><circle class="settled" cx="110" cy="108" r="34" stroke-dasharray="151.6 213.6" transform="rotate(-90 110 108)"/><text class="count " x="110" y="113" text-anchor="middle">62</text><text class="lab" x="110" y="159" text-anchor="middle">Decisions</text><circle class="disc " cx="300" cy="100" r="40"/><circle class="settled" cx="300" cy="100" r="40" stroke-dasharray="116.1 251.3" transform="rotate(-90 300 100)"/><text class="count " x="300" y="105" text-anchor="middle">145</text><text class="lab" x="300" y="157" text-anchor="middle">Issues</text><circle class="disc wait" cx="486" cy="118" r="28"/><circle class="settled" cx="486" cy="118" r="28" stroke-dasharray="88.0 175.9" transform="rotate(-90 486 118)"/><text class="count wait" x="486" y="123" text-anchor="middle">6</text><text class="lab" x="486" y="163" text-anchor="middle">Pull requests</text><circle class="disc " cx="186" cy="236" r="24"/><circle class="settled" cx="186" cy="236" r="24" stroke-dasharray="113.1 150.8" transform="rotate(-90 186 236)"/><text class="count " x="186" y="241" text-anchor="middle">4</text><text class="lab" x="186" y="277" text-anchor="middle">Deployments</text><circle class="item moved" cx="178" cy="58" r="9"/><circle class="item moved" cx="246" cy="44" r="9"/><circle class="item waiting" cx="46" cy="62" r="9"/><circle class="item waiting" cx="556" cy="72" r="9"/><circle class="item done" cx="552" cy="168" r="9"/><circle class="item loop" cx="376" cy="172" r="9"/></svg><div class="leg"><span class="chip moved">Moved</span><span class="chip waiting">Waits on you</span><span class="chip waiting">Wait: a session waits for a pull request</span><span class="chip done">Settled</span><span class="chip loop">Open loop</span><span class="chip idle">Edge width: references</span></div></div></div>
</body>
</html>
