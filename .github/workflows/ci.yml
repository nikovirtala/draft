name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI checks the tip of each push, never every commit. Node is the major pinned in mise.toml;
# pnpm comes from "packageManager" in package.json.
#
# A change that touches only docs/, Markdown files or the license skips typecheck, test, build and
# e2e: lint still runs (Biome, Markdown, commit messages, adr verify, issues verify), and `check`
# passes when the skipped jobs were skipped for that reason.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No base to compare with (a new branch, a force push): run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|LICENSE$)|\.md$'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch must be present for commitlint.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec adr verify
      - run: pnpm exec issues verify
      - name: Lint commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Only this PR's commits; main's history is never linted.
        run: pnpm exec commitlint --from "origin/$BASE_REF" --to "$HEAD_SHA" --verbose

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The desktop app end to end in Electron under Xvfb, with the fake agent and fake Kiro Remote.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The PR head, not the merge commit, as the build's vcs.ref.head.revision.
      - run: pnpm build
        env:
          DRAFT_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: xvfb-run -a pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: apps/desktop/e2e/artifacts/
          if-no-files-found: ignore

  # The one status to require in branch protection. It fails unless changes and lint passed and
  # every other job passed, or was skipped because the change touched only docs.
  check:
    if: ${{ always() }}
    needs: [changes, typecheck, lint, test, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES, code: $CODE, lint: $LINT, results: $RESULTS"
          [ "$CHANGES" = success ] && [ "$LINT" = success ] || exit 1
          for r in $RESULTS; do
            [ "$r" = success ] && continue
            [ "$r" = skipped ] && [ "$CODE" = false ] && continue
            exit 1
          done
